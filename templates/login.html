<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 安全中心</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 2rem;
            padding-bottom: 2rem;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .login-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .login-header h2 {
            color: #2c3e50;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .form-label {
            font-weight: 600;
            color: #34495e;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .btn-login {
            background: linear-gradient(to right, #3b82f6, #2563eb);
            border: none;
            padding: 0.85rem;
            font-weight: 600;
            transition: all 0.25s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .login-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            font-size: 0.92rem;
        }
        .login-footer a {
            color: #3b82f6;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 8px;
        }
        .security-note {
            background-color: #f0f9ff;
            border-left: 4px solid #3182ce;
            padding: 0.8rem;
            margin-top: 1.2rem;
            font-size: 0.88rem;
            color: #2c5282;
            border-radius: 0 6px 6px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <h2><i class="fas fa-user-lock"></i> 用户登录</h2>
                <p class="text-muted">安全访问您的账户</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">
                            {% if field.name == 'username' %}
                                <i class="fas fa-user"></i>
                            {% elif field.name == 'password' %}
                                <i class="fas fa-lock"></i>
                            {% endif %}
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger mt-1">
                                <i class="fas fa-exclamation-circle"></i> {{ field.errors|join:", " }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary w-100 btn-login">
                    <i class="fas fa-sign-in-alt"></i> 登录账户
                </button>

                <div class="login-footer">
                    <div>
                        <input type="checkbox" id="remember" name="remember" style="margin-right: 6px;">
                        <label for="remember" style="font-weight: normal; color: #6c757d;">记住我</label>
                    </div>
                    <a href="#" title="忘记密码？"><i class="fas fa-question-circle"></i> 忘记密码？</a>
                </div>

                <div class="security-note">
                    <i class="fas fa-shield-alt"></i> <strong>安全提示：</strong>请勿在公共设备上勾选“记住我”。
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0">没有账号？<a href="{% url 'register' %}"><i class="fas fa-user-plus"></i> 立即注册</a></p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} mt-4 mb-0">
                        <i class="{% if message.tags == 'success' %}fas fa-check-circle
                                 {% elif message.tags == 'error' %}fas fa-exclamation-triangle
                                 {% else %}fas fa-info-circle{% endif %}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>
    </div>

    <!-- Bootstrap JS (可选，用于某些交互组件) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
